site_name: Sentinel Engineering Docs
site_url: https://anjeshdubey.github.io/sentinel/engineering/
repo_url: https://github.com/anjeshdubey/sentinel
docs_dir: engineering-docs
site_dir: docs/engineering
use_directory_urls: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Repository Layout: repository-layout.md
  - Testing Strategy: testing.md
  - Deployment & Secrets: deployment.md
  - Contributing: contributing.md
  - Architecture Decisions:
      - Overview: adr/index.md
      - "0001. Automate frontend/docs mirror": adr/0001-automate-frontend-docs-mirror.md
