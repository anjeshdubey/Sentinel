# Sentinel configuration
#
# To switch provider/model, edit model.provider and model.default below and
# save — the running dev server (uvicorn --reload) picks it up automatically.
# No env vars or restart needed. Just tell Claude: "switch to gemini and
# gemini-flash" or "switch to anthropic and claude-opus" and it will make
# this edit for you.
#
# provider: "anthropic" | "gemini" | "groq"
# default/fallback: short alias (e.g. "claude-sonnet") or full provider model ID
# Auth: set ANTHROPIC_API_KEY / GEMINI_API_KEY / GROQ_API_KEY matching the
# active provider (env var, not this file).
#
# For a field set only via env var and not here, e.g.
# SENTINEL_MODEL__PROVIDER=gemini SENTINEL_MODEL__DEFAULT=gemini-flash
# that env value applies. But for any field set in BOTH this file and the
# environment, this file wins (see src/sentinel/config.py's docstring).

model:
  provider: "groq"
  default: "groq-llama"
  # provider: "anthropic"
  # default: "claude-sonnet"
  # provider: "gemini"
  # default: "gemini-flash"
  fallback: "claude-sonnet"
  temperature: 0.0
  max_tokens: 1024

output:
  jsonl_path: "./data/incidents.jsonl"
  console_format: "rich"  # rich | json | minimal

logging:
  level: "INFO"
