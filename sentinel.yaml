# Sentinel configuration
# Override provider via: SENTINEL_PROVIDER=anthropic | gemini | groq
# Override model via: SENTINEL_MODEL=claude-opus (short alias) or a full provider model ID
# Auth via: ANTHROPIC_API_KEY / GEMINI_API_KEY / GROQ_API_KEY (matching the active provider)

model:
  provider: "anthropic"
  default: "claude-sonnet"
  fallback: "claude-opus"
  temperature: 0.0
  max_tokens: 1024

output:
  jsonl_path: "./data/incidents.jsonl"
  console_format: "rich"  # rich | json | minimal

logging:
  level: "INFO"
