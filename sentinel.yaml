# Sentinel configuration
# Override model via: SENTINEL_MODEL=claude-opus (short alias) or a full Anthropic model ID
# Auth via: ANTHROPIC_API_KEY

model:
  default: "claude-sonnet"
  fallback: "claude-opus"
  temperature: 0.0
  max_tokens: 1024

output:
  jsonl_path: "./data/incidents.jsonl"
  console_format: "rich"  # rich | json | minimal

logging:
  level: "INFO"
