name: docs

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "TEST_PLAN.md"
      - "engineering-docs/**"
      - "mkdocs.yml"
      - ".markdownlint-cli2.jsonc"
      - "lychee.toml"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "README.md"
      - "TEST_PLAN.md"
      - "engineering-docs/**"
      - "mkdocs.yml"
      - ".markdownlint-cli2.jsonc"
      - "lychee.toml"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  markdownlint:
    name: markdownlint (report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      # continue-on-error: this repo's Markdown has never been linted before.
      # Ship the first real run as report-only; once the violation count is
      # known and .markdownlint-cli2.jsonc is tuned against it, remove this
      # line and DavidAnson/markdownlint-cli2-action#pin-to-sha below to make
      # it a blocking gate. Pin to a commit SHA at that point too (matching
      # the actions/checkout@<sha> convention elsewhere in this repo) rather
      # than trusting a floating major-version tag indefinitely.
      - name: run markdownlint-cli2
        continue-on-error: true
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: |
            README.md
            TEST_PLAN.md
            engineering-docs/**/*.md

  lychee:
    name: dead-link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      # Blocking (no continue-on-error): a broken link is objectively true or
      # false, unlike a style lint finding, so low false-positive risk once
      # lychee.toml's excludes cover known non-dead illustrative URLs.
      - name: run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml README.md TEST_PLAN.md engineering-docs
          fail: true

  mkdocs-build-strict:
    name: mkdocs build --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: install docs dependencies
        run: pip install ".[docs]"
      - name: build (throwaway output, not committed)
        run: mkdocs build --strict

  engineering-docs-publish:
    name: docs/engineering/ auto-rebuild (main only)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: install docs dependencies
        run: pip install ".[docs]"
      - name: build engineering docs
        run: mkdocs build --strict
      - name: commit + push if docs/engineering/ changed
        env:
          BOT_COMMIT_PREFIX: "chore(docs): rebuild engineering docs"
        run: |
          if git diff --quiet -- docs/engineering; then
            echo "docs/engineering/ already in sync"
            exit 0
          fi
          last_msg=$(git log -1 --pretty=%s)
          if [[ "$last_msg" == "$BOT_COMMIT_PREFIX"* ]]; then
            echo "last commit was already a bot regen; not pushing to avoid loop"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/engineering
          git commit -m "$BOT_COMMIT_PREFIX"
          branch="${GITHUB_REF#refs/heads/}"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${branch}"; then
              echo "push succeeded on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt rejected; rebasing onto origin/${branch}"
            git fetch origin "${branch}"
            if ! git rebase "origin/${branch}"; then
              echo "rebase produced a conflict; aborting and giving up cleanly"
              git rebase --abort || true
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          echo "push failed after 5 attempts; main will self-heal on next push"
          exit 0
