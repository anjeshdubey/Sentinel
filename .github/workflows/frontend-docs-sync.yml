name: frontend-docs-sync

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "scripts/sync_frontend_to_docs.py"
      - ".github/workflows/frontend-docs-sync.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "docs/*.html"
      - "docs/*.js"
      - "docs/*.css"
      - "docs/*.json"
      - "scripts/sync_frontend_to_docs.py"
      - ".github/workflows/frontend-docs-sync.yml"

permissions:
  contents: read

jobs:
  sync-frontend-to-docs:
    name: docs/ auto-sync (main only)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: sync docs/ from frontend/
        run: python3 scripts/sync_frontend_to_docs.py
      - name: commit + push if docs/ changed
        env:
          BOT_COMMIT_PREFIX: "chore(docs): sync from frontend/"
        run: |
          if git diff --quiet -- docs/*.html docs/*.js docs/*.css docs/*.json; then
            echo "docs/ already in sync"
            exit 0
          fi
          last_msg=$(git log -1 --pretty=%s)
          if [[ "$last_msg" == "$BOT_COMMIT_PREFIX"* ]]; then
            echo "last commit was already a bot regen; not pushing to avoid loop"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.html docs/*.js docs/*.css docs/*.json
          git commit -m "$BOT_COMMIT_PREFIX"
          branch="${GITHUB_REF#refs/heads/}"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${branch}"; then
              echo "push succeeded on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt rejected; rebasing onto origin/${branch}"
            git fetch origin "${branch}"
            if ! git rebase "origin/${branch}"; then
              echo "rebase produced a conflict; aborting and giving up cleanly"
              git rebase --abort || true
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          echo "push failed after 5 attempts; main will self-heal on next push"
          exit 0

  frontend-docs-drift:
    name: frontend/docs/ drift advisory
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: check frontend/ vs docs/ drift
        run: |
          if ! python3 scripts/sync_frontend_to_docs.py --check; then
            echo "::warning::docs/ is out of sync with frontend/. It will self-heal on merge to main — no action needed unless you want it synced before review."
          fi
