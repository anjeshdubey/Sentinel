[project]
name = "sentinel"
version = "0.1.0"
description = "LLM-powered SRE triage agent — structured understanding from raw alerts"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Anjesh Dubey" }
]

dependencies = [
    "anthropic>=0.40.0",
    "google-genai>=1.0.0",
    "groq>=0.11.0",
    "httpx>=0.27.0",
    "instructor>=1.5.0",
    "mcp[cli]>=1.20.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "typer>=0.12.0",
    "rich>=13.9.0",
    "pyyaml>=6.0.0",
    "python-frontmatter>=1.1.0",
]

[project.optional-dependencies]
rag = [
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",
    "qdrant-client>=1.12.0",
]
observability = [
    "langfuse>=2.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "respx>=0.21.0",
    "fastapi>=0.115.0",
]
# Future dependencies (not installed yet)
# api = ["uvicorn>=0.32.0"]
# graph = ["langgraph>=0.2.0"]
# storage = ["sqlmodel>=0.0.22"]

[project.scripts]
sentinel = "sentinel.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "B", "A", "COM", "C4", "PTH"]
ignore = ["ANN101", "ANN102", "COM812"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that call real LLM APIs (deselect with -m 'not integration')",
    "slow: tests requiring large model downloads or network access (deselect with -m 'not slow')",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
